preprocessing:
  representation_for_models: "text_lemmatized"
  min_tokens_after_clean: 5
  discretization_bins: [0.0, 4.0, 7.0, 10.01]
  class_names:
    - "Faible (0-4)"
    - "Moyenne (4-7)"
    - "Élevée (7-10)"
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  vocab_min_freq: 2
  vocab_max_size: 20000
  max_seq_len: 160

part1_models:
  architectures:
    - "rnn"
    - "birnn"
    - "gru"
    - "lstm"
  tuning:
    n_trials_per_arch: 6
    epochs: 12
    patience: 4
    search_space:
      embedding_dim: [64, 128, 192]
      hidden_dim: [64, 128, 256]
      num_layers: [1, 2]
      dropout: [0.2, 0.5]
      lr: [0.0005, 0.003]
      batch_size: [32, 64]
      pooling: ["last", "mean", "mean_max"]
  final_training:
    epochs: 25
    patience: 6
    weight_decay: 0.0001
    grad_clip: 1.0
  lm_benchmark:
    epochs: 10
    embedding_dim: 128
    hidden_dim: 256
    num_layers: 2
    dropout: 0.3
    lr: 0.002
    batch_size: 32
    max_len: 48
    prefix_len: 6
    gen_max_tokens: 20
    mask_prob: 0.15

part2_gpt2:
  model_name: "aubmindlab/aragpt2-base"
  block_size: 256
  epochs: 4
  batch_size: 8
  grad_accum_steps: 2
  lr: 0.00005
  warmup_ratio: 0.1
  weight_decay: 0.01
  generation:
    max_new_tokens: 150
    min_new_tokens: 60
    temperature: 0.8
    top_k: 50
    top_p: 0.92
    repetition_penalty: 1.35
    no_repeat_ngram_size: 3
    num_beams: 5
  seed_prompts:
    - "يُعد الذكاء الاصطناعي من أبرز التقنيات الحديثة التي"
    - "تعتمد الشبكات العصبية العميقة على طبقات متعددة من"
    - "تُستخدم معالجة اللغات الطبيعية في فهم وتوليد"
    - "ساهمت خوارزميات تعلم الآلة في تطوير مجالات طبية وصناعية مثل"
    - "يمثل نموذج المحولات نقلة نوعية في مجال النماذج اللغوية حيث"
